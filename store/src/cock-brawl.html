<style>
  /* main-site game nav (identical to the other Degen Dojo games) */
  .gsite-nav{position:sticky;top:0;z-index:200;display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;background:rgba(10,10,15,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(200,150,42,.25);padding:8px 10px;-webkit-overflow-scrolling:touch;}
  .gsite-nav::-webkit-scrollbar{display:none;}
  .gsite-nav a{font-family:'Cinzel',serif;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#b9a988;text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap;flex:none;}
  .gsite-nav a.on{color:#e8c24a;background:rgba(200,150,42,.14);}
  .gsite-nav a:hover{color:#e8c24a;}
  .gback{width:100%;max-width:1080px;margin:0 auto;padding:9px 16px 0;}
  .gback a{color:#c8962a;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;}
  @media(max-width:600px){ .gsite-nav{justify-content:flex-start;gap:2px;padding:6px 8px;} .gsite-nav a{font-size:11px;padding:5px 8px;letter-spacing:.02em;} .gback{padding:7px 14px 0;} }
  :root{--bg:#100a06;--panel:#1a120c;--border:#3a2a18;--gold:#c9973a;--gold-l:#e8b84b;--mut:#9a866a;--ink:#f4ead6;--red:#c0392b;--hp:#5bd06a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -5%,#241608,#100a06);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  .top{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);background:rgba(10,8,5,.92);flex-wrap:wrap}
  .brand{font-family:'Cinzel',serif;font-weight:900;color:var(--gold-l);letter-spacing:.04em}
  .top .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
  .coin{font-family:'Teko',sans-serif;font-size:16px;color:var(--gold-l);padding:6px 12px;border:1px solid var(--border);border-radius:9px}
  button{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.05em;color:#0a0705;background:linear-gradient(135deg,#e8b84b,#b57e1e);border:0;padding:9px 16px;border-radius:9px;cursor:pointer}

  button:disabled{opacity:.45;cursor:not-allowed}
  .wrap{max-width:820px;margin:0 auto;padding:22px 14px 26px;text-align:center}
  .freetag{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:.04em;color:var(--mut)}
  /* title typography matched to DEGEN DUEL: Cinzel eyebrow + Teko gold-gradient title */
  .t-dojo{font-family:'Cinzel',serif;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--gold);margin:2px 0 0}
  h1{font-family:'Teko',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(32px,7vw,56px);line-height:.82;letter-spacing:.03em;background:linear-gradient(180deg,#f4e2b4 0%,#e8b84b 45%,#c9973a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;color:transparent;margin:2px 0 5px}
  .sub{color:var(--mut);font-size:14px;margin-bottom:14px}
  /* the ring — a square dojo mat with ropes + corner posts */
  .ring{position:relative;width:min(520px,94vw);height:min(520px,94vw);margin:4px auto 0;border-radius:16px;
    background:radial-gradient(circle at 50% 50%,#f3ead6,#e6d8ba 82%);
    border:9px solid #6b4a2b;box-shadow:inset 0 0 60px rgba(90,55,25,.30),0 12px 30px rgba(0,0,0,.5);overflow:hidden}
  .ring::before{content:"";position:absolute;inset:12px;border:1px solid rgba(120,80,45,.28);border-radius:8px}
  /* red center disc — the fighting circle; reads as the Japanese-flag sun on the pale field */
  .ring::after{content:"";position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(192,40,34,.8);background:radial-gradient(circle,rgba(192,40,34,.12),rgba(192,40,34,.04) 70%);border-radius:50%}
  .post{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4e2b4,#8b6018);z-index:5;box-shadow:0 0 8px rgba(0,0,0,.6)}
  .post.tl{top:6px;left:6px}.post.tr{top:6px;right:6px}.post.bl{bottom:6px;left:6px}.post.br{bottom:6px;right:6px}
  /* move set */
  .chick.jk .c{transform:translateY(-28px) scale(1.16) rotate(-18deg)}
  .chick.spin .c{animation:spinmove .5s}
  @keyframes spinmove{to{transform:rotate(360deg) scale(1.16)}}
  .chick.slap .c{transform:translateX(12px) rotate(15deg) scale(1.1)}
  .chick.dodge .c{transform:translateX(-22px) scale(.94)}
  .cw{position:relative;display:block}
  .chick.left .cw{transform:scaleX(-1)}   /* left team turns to face the right team */
  .chick{position:absolute;transform:translate(-50%,-50%);transition:left .5s ease,top .5s ease;cursor:pointer;text-align:center;z-index:2}
  .chick .c{font-size:60px;line-height:1;display:block;filter:drop-shadow(0 6px 7px rgba(0,0,0,.5));transition:transform .18s}
  .chick.backed .c{transform:scale(1.16);filter:drop-shadow(0 5px 6px rgba(0,0,0,.5)) drop-shadow(0 0 11px rgba(232,184,75,.75))}
  .chick.jump .c{transform:translateY(-18px) scale(1.08)}
  .chick.kick .c{transform:scale(1.24) rotate(-14deg)}
  .chick.hit .c{animation:shake .3s}
  @keyframes shake{10%,90%{transform:translateX(-3px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .chick.out{animation:fly .85s ease-in forwards;pointer-events:none}
  @keyframes fly{to{transform:translate(-50%,-50%) translateY(-150px) rotate(430deg) scale(.35);opacity:0}}
  .chick.win{z-index:8}
  .chick.win .c{animation:champ 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(232,184,75,.55))}
  @keyframes champ{0%,100%{transform:translateY(0) scale(1.55)}50%{transform:translateY(-18px) scale(1.72)}}
  /* Japanese rising sun behind the champion */
  /* rising sun fills the whole pit; a radial mask punches a beige hole in the middle
     (matching the inner circle) so the champion stays visible on beige, rays only outside it */
  .sun{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(192,57,43,.9) 0deg 11deg,transparent 11deg 22deg);
    -webkit-mask:radial-gradient(circle closest-side,transparent 0 39.5%,#000 42.5%);
    mask:radial-gradient(circle closest-side,transparent 0 39.5%,#000 42.5%);
    opacity:0;transition:opacity .5s ease;z-index:1;pointer-events:none}
  .sun.on{opacity:.92;animation:sunspin 11s linear infinite}
  @keyframes sunspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.sun.on{animation:none}}
  /* champion name — gold, below the pit (outside the ring) */
  .champ-name{min-height:0;margin:8px auto 0;font-family:'Cinzel',serif;font-weight:900;letter-spacing:.02em;
    font-size:clamp(22px,5.4vw,36px);line-height:1.05;
    background:linear-gradient(180deg,#f9e9b6,#e8b84b 52%,#a9781f);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
  .champ-name .cap{display:block;font-family:'Teko',sans-serif;font-weight:600;letter-spacing:.22em;font-size:13px;-webkit-text-fill-color:var(--gold);color:var(--gold);margin-bottom:1px}
  .champ-name.show{opacity:1;transform:none}
  /* ⚔️ FIGHT trigger — appears in the centre of the inner circle once a cock is picked */
  .swords{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;
    cursor:pointer;pointer-events:auto;text-align:center;animation:swordpulse 1.05s ease-in-out infinite}
  .swords.show{display:block}
  .swords .sw{font-size:62px;line-height:1;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}   /* the glyph itself is centred */
  .swords .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;white-space:nowrap;
    font-family:'Cinzel',serif;font-weight:900;letter-spacing:.16em;color:var(--red);font-size:19px;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  @keyframes swordpulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.11)}}
  @media(prefers-reduced-motion:reduce){.swords{animation:none}}
  /* champion name shown INSIDE the inner circle, just below the winning cock (on beige) */
  .champ-in{position:absolute;left:50%;top:63%;transform:translate(-50%,0);z-index:9;text-align:center;max-width:46%;
    opacity:0;transition:opacity .45s ease;pointer-events:none}
  .champ-in .cap{display:block;font-family:'Teko',sans-serif;font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--red)}
  .champ-in .nm{display:inline-block;white-space:nowrap;font-family:'Cinzel',serif;font-weight:900;letter-spacing:.01em;line-height:1.05;
    font-size:22px;background:linear-gradient(180deg,#d8a836,#8b6018);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .champ-in.show{opacity:1}
  /* roster — names + draining health bars, OUTSIDE the pit */
  /* two columns that mirror the pit: LEFT column = left team (i0-3), RIGHT column = right team
     (i4-7). grid-auto-flow:column fills the first column top-to-bottom, then the second. */
  /* DESKTOP: the two name+bar columns FLANK the pit — 4 fighters' cards on the left of the pitch,
     4 on the right, each a chicken + name + draining bar beside it. MOBILE is unchanged: the pit on
     top, the same two columns side-by-side below it (identical to the old 2-col roster grid). */
  .pitrow{display:flex;align-items:center;justify-content:center;gap:16px;max-width:min(1040px,96vw);margin:4px auto 0;flex-wrap:nowrap}
  .ring{flex:0 0 auto}
  .roster{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0;max-width:220px}
  @media(max-width:600px){
    .pitrow{flex-wrap:wrap;gap:8px;max-width:min(520px,94vw)}
    .ring{order:-1;flex:1 1 100%;width:100%}
    .roster{flex:1 1 0;max-width:none;margin-top:14px}
  }
  /* DESKTOP: the 4 cards span the FULL pit height (space-between) so they balance the beige board,
     each sitting beside its chicken; taller cards + longer/taller bars. (Mobile is untouched.) */
  @media(min-width:601px){
    .pitrow{align-items:stretch}
    .roster{gap:10px;max-width:262px}
    .rcard{flex:1 1 0;justify-content:center;padding:0 16px;gap:13px}   /* each card = 1/4 of the pit height = one cock's height */
    .rhead .ri{font-size:22px}
    .rname{font-size:16px}
    .hpbar{height:17px}                                                /* a bit higher bar */
  }
  .rcard{background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:10px;padding:7px 9px 8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:opacity .35s,border-color .2s,box-shadow .2s}
  .rcard.backed{border-color:var(--gold);background:rgba(201,151,58,.14);box-shadow:0 0 0 1px rgba(201,151,58,.4)}
  .rcard.dead{opacity:.32;filter:grayscale(.7);cursor:default}
  .rhead{display:flex;align-items:center;gap:6px;min-width:0}
  .rhead .ri{font-size:16px;line-height:1;flex:0 0 auto}
  .rcard.left .ri{transform:scaleX(-1)}   /* left-team roster icons face right, same as their pit fighters */
  .rname{font-family:'Teko',sans-serif;font-size:13.5px;letter-spacing:.02em;color:#e8d8b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard.backed .rname{color:var(--gold-l)}
  .rcard.dead .rname::after{content:' 💀'}
  .rcard.win{border-color:var(--gold);background:rgba(201,151,58,.18);box-shadow:0 0 0 1px rgba(201,151,58,.45)}
  .rcard.win .rname{color:var(--gold-l)}
  .rcard.win .rname::after{content:' 👑'}
  .hpbar{height:7px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
  .hpfill{height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#5bd06a,#8fe08a);transition:width .32s ease,background .3s}
  .hpfill.mid{background:linear-gradient(90deg,#e8b84b,#f4d06a)}
  .hpfill.low{background:linear-gradient(90deg,#c0392b,#e8604a)}
  .pop{position:absolute;z-index:6;font-family:'Teko',sans-serif;font-weight:700;font-size:26px;color:#fff;text-shadow:0 2px 0 #000,0 0 10px #c0392b;pointer-events:none;animation:pop .8s ease-out forwards}
  @keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-16px) scale(1.15);opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
  .feather{position:absolute;z-index:5;font-size:20px;pointer-events:none;animation:fall 1.2s ease-in forwards}
  @keyframes fall{0%{opacity:1}100%{transform:translateY(120px) translateX(var(--fx,20px)) rotate(320deg);opacity:0}}
  .count{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:7;font-family:'Teko',sans-serif;font-size:16px;color:var(--gold-l);background:rgba(0,0,0,.55);padding:3px 12px;border-radius:20px;border:1px solid var(--border)}
  .ctrl{margin-top:10px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
  .result{margin-top:8px;min-height:0;font-family:'Teko',sans-serif;font-size:24px}
  .win-t{color:var(--hp)} .lose-t{color:var(--red)}
  .fair{font-size:11px;color:#8a7a5e;margin-top:8px}
  .fair b{font-family:ui-monospace,monospace;color:#cdbfa2;font-weight:400}
  .hint{color:var(--mut);font-size:13px;margin-top:6px}
</style></head>

<script>
const NAMES=["Sir Cluck-a-Lot","El Pollo Loco","Cluck Norris","Hen Solo","Gordon RamsHen","The Notorious C.O.C.K.","Beak Wick","Feather Locklear","Colonel Cluster","Nugget 'The Fridge'","Yolko Ono","The Rock Chickson","Mother Clucker","Sir Pecks-a-Lot","Cluck Kent","Hentai Hulk"];
const HITS=["PECK! 🪶","SPUR SLAP!","BEAK BONK!","WING WHACK!","CLAW COMBO!","FLYING KICK!","BAWK ATTACK!","TALON DROP!","DRUMSTICK!","COMB-BREAKER!","GET PLUCKED!"];
const $=id=>document.getElementById(id);
let SEED=null, COMMITHASH=null, WINNER=null, SEL=null, BUSY=false, N=8;
let chicks=[], base=[], RAND=Math.random, moveTimer=null;

const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function sha256(str){ return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))); }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashInt(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// 4 v 4 standoff: team A down the left, team B down the right, facing the centre
// standoff: two teams lined up on the pit walls, OUTSIDE the 60% centre circle (they
// move inside it once the fight starts). x=12/88 keeps them clear of the circle line.
function standoffPos(i){ const left=i<4, row=left?i:i-4; return { x: left?12:88, y: 14+row*24 }; }
// Natural gamefowl colours only — red, black, white, brown (no green/blue). 8 birds
// across those four families with light/dark shades so each still reads as its own.
const LOOKS=[
  'sepia(.6) saturate(4) brightness(.92) hue-rotate(-18deg)',    // 0 red
  'brightness(.6) contrast(1.28) saturate(1.35)',                // 1 black — lifted so the red comb + detail read
  'brightness(1.62) saturate(.32) contrast(1.02)',               // 2 white
  'sepia(.7) saturate(2.1) brightness(.82) hue-rotate(-8deg)',   // 3 brown
  'sepia(.65) saturate(5) brightness(.7) hue-rotate(-16deg)',    // 4 deep red
  'sepia(.75) saturate(2.4) brightness(.58)',                    // 5 dark chocolate
  'brightness(1.42) saturate(.55) contrast(1.0) sepia(.18)',     // 6 cream/off-white
  'sepia(.62) saturate(2.6) brightness(1.06) hue-rotate(-6deg)'  // 7 light tan/buff
];

async function newBout(){
  if(BUSY) return;
  clearInterval(moveTimer); moveTimer=null;
  SEL=null; BUSY=false;
  const names=shuffle(NAMES, Math.random).slice(0,N);
  const ring=$('ring'); [...ring.querySelectorAll('.chick')].forEach(e=>e.remove());
  $('sun').classList.remove('on');
  $('swords').classList.remove('show');
  const ci=$('champIn'); ci.classList.remove('show'); ci.innerHTML='';
  const rosL=$('rosterL'), rosR=$('rosterR'); rosL.innerHTML=''; rosR.innerHTML='';
  chicks=[];
  for(let i=0;i<N;i++){
    const p=standoffPos(i), look=LOOKS[i%LOOKS.length]||'none';
    // the fighter in the pit — no name, no crown (names live in the roster below)
    const el=document.createElement('div'); el.className='chick'+(i<4?' left':''); el.dataset.i=i;
    el.style.left=p.x+'%'; el.style.top=p.y+'%';
    el.innerHTML=`<span class="cw"><span class="c" style="filter:${look}">🐓</span></span>`;
    el.onclick=()=>pickChick(i);
    ring.appendChild(el);
    const c={i, name:names[i], el, alive:true, hp:100};
    // roster card OUTSIDE the pit — name + draining health bar
    const rc=document.createElement('div'); rc.className='rcard'+(i<4?' left':''); rc.dataset.i=i; rc.onclick=()=>pickChick(i);
    rc.innerHTML=`<div class="rhead"><span class="ri" style="filter:${look}">🐓</span><span class="rname">${names[i]}</span></div><div class="hpbar"><div class="hpfill"></div></div>`;
    (i<4?rosL:rosR).appendChild(rc);
    c.rcard=rc; c.hpfill=rc.querySelector('.hpfill');
    chicks.push(c);
  }
  $('result').textContent='';
  SEED=hex(crypto.getRandomValues(new Uint8Array(32)));
  COMMITHASH=await sha256(SEED);
  WINNER=hashInt(SEED+':brawl')%N;
  $('fair').innerHTML=`🔒 Provably fair · winner committed as <b>${COMMITHASH.slice(0,10)}…${COMMITHASH.slice(-6)}</b> before your pick.`;
}
function pickChick(i){
  if(BUSY||!chicks[i]||!chicks[i].alive) return;
  SEL=i;
  chicks.forEach(c=>{ c.el.classList.toggle('backed', c.i===i); if(c.rcard) c.rcard.classList.toggle('backed', c.i===i); });
  $('swords').classList.add('show');            // the ⚔️ FIGHT trigger appears in the centre of the ring
}
// drain (or set) a fighter's health bar, recolouring as it runs low
function setHp(c,hp){ c.hp=Math.max(0,Math.min(100,hp)); if(c.hpfill){ c.hpfill.style.width=c.hp+'%'; c.hpfill.classList.toggle('mid',c.hp<=55&&c.hp>25); c.hpfill.classList.toggle('low',c.hp<=25); } }

function pop(el,txt){ const e=document.createElement('div'); e.className='pop'; e.textContent=txt; e.style.left='50%'; e.style.top='0'; el.appendChild(e); setTimeout(()=>e.remove(),800); }
function feathers(el){ for(let i=0;i<8;i++){ const f=document.createElement('div'); f.className='feather'; f.textContent='🪶'; f.style.left='50%'; f.style.top='0'; f.style.setProperty('--fx',(Math.random()*80-40)+'px'); el.appendChild(f); setTimeout(()=>f.remove(),1200);} }
function wander(){ // survivors close in and scrap INSIDE the red centre circle
  chicks.filter(c=>c.alive).forEach(c=>{ const x=Math.max(27,Math.min(73,50+(RAND()*36-18))); const y=Math.max(27,Math.min(73,50+(RAND()*36-18))); c.el.style.left=x+'%'; c.el.style.top=y+'%'; }); }

async function fight(){
  if(BUSY||SEL===null) return;
  // One coin per bout, like every other game (free when the store's coin economy is off).
  if(window.DojoCredits && !DojoCredits.play('Cock Brawl')) return;
  const revealed=SEED;                                  // client-side provably fair
  BUSY=true; $('swords').classList.remove('show');      // swords vanish during the fight
  chicks.forEach(c=>{ if(c.i!==SEL) c.el.classList.remove('backed'); });
  RAND=mulberry32(hashInt(revealed));
  $('result').textContent='🥊 BRAWL!';
  moveTimer=setInterval(wander, 620); wander();
  const MOVES=[['jk','🦵 FLYING KICK!'],['spin','🌀 SPIN KICK!'],['slap','🪽 WING SLAP!'],['hit','PECK-PECK-PECK!'],['hit','💥 HEADBUTT!'],['jk','🥋 ROOSTER ROUNDHOUSE!'],['spin','🌪 FEATHER TORNADO!']];
  const near=(a,b)=>{ a.el.style.left=b.el.style.left; a.el.style.top=b.el.style.top; };
  const doMove=async(el,cls,txt,vEl)=>{ el.classList.add(cls); if(vEl){ vEl.classList.add('hit'); pop(vEl,txt); feathers(vEl);} await wait(170); el.classList.remove(cls); if(vEl) vEl.classList.remove('hit'); };
  // two random survivors trade blows — flavour between KOs, sometimes a dodge/counter
  const clash=async()=>{ const al=chicks.filter(c=>c.alive); if(al.length<2) return; const a=al[(RAND()*al.length)|0]; let d=a; while(d===a) d=al[(RAND()*al.length)|0]; near(a,d);
    const m=MOVES[(RAND()*MOVES.length)|0];
    if(RAND()<0.28){ d.el.classList.add('dodge'); pop(d.el,'WHIFF! 💨'); await doMove(a.el,m[0],m[1],null); d.el.classList.remove('dodge'); }
    else { await doMove(a.el,m[0],m[1],d.el); if(RAND()<0.5){ const m2=MOVES[(RAND()*MOVES.length)|0]; await doMove(d.el,m2[0],m2[1],a.el); } } };
  // seeded elimination order — the winner never falls
  const losers=shuffle(chicks.map(c=>c.i).filter(i=>i!==WINNER), RAND);
  const champC=chicks[WINNER];
  for(const li of losers){
    const victim=chicks[li];
    // drain this bird's health over several exchanges before it drops — that's the tension
    const hits=2+(RAND()<0.5?1:0);                       // 2–3 hits to zero
    for(let h=0; h<hits && victim.hp>0; h++){
      if(h===0) await clash();                           // open with a bit of background chaos
      const atkers=chicks.filter(c=>c.alive && c.i!==li);
      const atk=atkers[(RAND()*atkers.length)|0]||champC;
      const mv=MOVES[(RAND()*MOVES.length)|0];
      near(atk,victim);
      const dmg=Math.ceil(victim.hp/(hits-h)) + ((RAND()*10)|0);   // guaranteed empty by the last hit
      await doMove(atk.el, mv[0], mv[1], victim.el);
      setHp(victim, victim.hp-dmg); pop(victim.el, '-'+Math.min(dmg,victim.hp+dmg));
      if(RAND()<0.4) setHp(champC, Math.max(38, champC.hp-(3+((RAND()*7)|0))));  // champ takes the odd chip, never fatal
      await wait(75);
    }
    setHp(victim,0);
    pop(victim.el,'K.O.! 💥'); feathers(victim.el);
    victim.alive=false; victim.el.classList.add('out');
    if(victim.rcard) victim.rcard.classList.add('dead');
    await wait(130);
  }
  clearInterval(moveTimer); moveTimer=null;
  const champ=chicks[WINNER];
  champ.el.style.left='50%'; champ.el.style.top='50%'; champ.el.classList.add('win'); pop(champ.el,'🏆 CHAMPION!');
  if(champ.rcard){ champ.rcard.classList.remove('backed'); champ.rcard.classList.add('win'); }   // crown 👑 the winner's box (like 💀 for the fallen)
  if(SEL!=null && window.DojoScores) DojoScores.record('brawl', SEL===WINNER);   // feeds the 🏆 rankings (win if you backed the champ)
  $('sun').classList.add('on');                     // rising sun blooms behind the champ
  $('result').textContent='';                       // nothing below — the winner is shown inside the circle
  // CHAMPION + name INSIDE the inner circle, just below the winning cock (on beige).
  // Shrink long names to fit within the circle so they never spill past the border.
  const ci=$('champIn'); ci.innerHTML='<span class="cap">CHAMPION</span><span class="nm">'+champ.name+'</span>';
  const nm=ci.querySelector('.nm'), maxW=$('ring').clientWidth*0.44;
  let fs=22; nm.style.fontSize=fs+'px';
  while(nm.scrollWidth>maxW && fs>10){ fs--; nm.style.fontSize=fs+'px'; }
  ci.classList.add('show');
  $('fair').innerHTML=`✓ Verify: SHA-256(seed)=<b>${COMMITHASH.slice(0,10)}…</b> · seed <b>${revealed.slice(0,10)}…${revealed.slice(-6)}</b> · winner = hash(seed)%8 = #${WINNER+1}.`;
  await wait(5000);                                  // hold the champion for 5 seconds…
  BUSY=false; newBout();                             // …then auto-reset (pick a cock → the FIGHT swords reappear)
}

$('cbSb').onclick=()=>{ if(window.DojoScores) DojoScores.renderBoard($('cbSbBoard'),'brawl'); document.getElementById('cbSbModal').style.display='flex'; };
newBout();
</script>
</body></html>
